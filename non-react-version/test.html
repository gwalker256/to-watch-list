<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To Watch List</title>
  <link rel="stylesheet" href="test.css"/>
</head>
<body>
  <div class="App">
    <h1>To Watch List</h1>
    
    <!-- Auth Section -->
    <div id="auth-container" class="auth-container" style="display: none;">
      <h2>Sign In</h2>
      <form id="signInForm">
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button type="submit">Sign In</button>
      </form>
    </div>
    
    <!-- Content Section (shown when authenticated) -->
    <div id="content-container" style="display: none;">
      <div class="welcome-container">
        <p id="welcome-message">Welcome, user!</p>
      </div>
      
      <div class="lists-container">
        <!-- Movies Section -->
        <div class="list-section">
          <h2>Movies</h2>
          <div class="input-container">
            <input type="text" id="movie-title" placeholder="Title" class="add-input" />
            <input type="text" id="movie-genre" placeholder="Genre" class="add-input" />
            <input type="text" id="movie-runtime" placeholder="Length" class="add-input" />
            <button id="add-movie" class="add-btn">Add Movie</button>
          </div>
          <ul id="movies-list"></ul>
        </div>
        
        <!-- TV Shows Section -->
        <div class="list-section">
          <h2>TV Shows</h2>
          <div class="input-container">
            <input type="text" id="tv-title" placeholder="Title" class="add-input" />
            <input type="text" id="tv-genre" placeholder="Genre" class="add-input" />
            <input type="text" id="tv-runtime" placeholder="Length" class="add-input" />
            <button id="add-tv" class="add-btn">Add TV Show</button>
          </div>
          <ul id="tv-list"></ul>
        </div>
      </div>
      
      <div class="sign-out-container">
        <button id="signOutBtn" class="sign-out">Sign Out</button>
      </div>
    </div>
  </div>
  
  <script src="testsecrets.js"></script>
  <!-- Firebase SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-firestore-compat.js"></script>

  <!-- JavaScript -->
  <script src="testjs.js"></script>
</body>
</html>
