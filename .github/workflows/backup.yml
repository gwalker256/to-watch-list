name: Backup

on:
  workflow_dispatch:  # Trigger manually or schedule later

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install firebase-admin
      - name: Install dependencies
        run: npm install firebase-admin

      # Debugging step: List files to ensure the script is found
      - name: Debug - List files
        run: ls -la

      # Create the Firebase service account credentials from secret and set the environment variable
      - name: Create Firebase service account credentials
        run: echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT }}" > service-account.json

      # Debugging step: Check if the service-account.json file exists
      - name: Verify service account file exists
        run: ls -la service-account.json

      # Debugging step: Print the first few lines of the service account file to check the content
      - name: Display service account file content
        run: head -n 10 service-account.json  # Prints first 10 lines for verification

      # Run the Firestore export script
      - name: Run Firestore backup
        env:
          GOOGLE_APPLICATION_CREDENTIALS: './service-account.json'  # Point to the generated file
        run: node export-firestore.js

