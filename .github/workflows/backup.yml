name: Backup

on:
  workflow_dispatch:  # Trigger manually or schedule later

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 3. Install firebase-admin
      - name: Install dependencies
        run: npm install firebase-admin

      # 4. Debug: List files to ensure the script is present
      - name: Debug - List files
        run: ls -la

      # 5. Create the service-account.json file from the secret, preserving formatting
      - name: Create Firebase service account credentials
        run: |
          cat <<EOF > service-account.json
          ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          EOF

      # 6. Debug: Verify the service-account.json content
      - name: Debug - Show first lines of credentials
        run: head -n 5 service-account.json

      # 7. Run the Firestore export script, using ADC
      - name: Run Firestore backup
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ./service-account.json
        run: node export-firestore.js
