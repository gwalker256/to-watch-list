name: Firestore Export

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'  # Weekly on Sunday at midnight UTC

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # Add timeout to prevent hanging
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm install @google-cloud/firestore fs-extra
        
      - name: Create service account key file
        run: |
          mkdir -p .credentials
          echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > .credentials/service-account.json
          # Validate JSON format
          jq empty .credentials/service-account.json || (echo "❌ Invalid JSON" && exit 1)
      
      - name: Set Google Application Credentials
        run: echo "GOOGLE_APPLICATION_CREDENTIALS=${{ github.workspace }}/.credentials/service-account.json" >> $GITHUB_ENV
      
      - name: Export Firestore data
        run: node export-firestore.js
      
      - name: Archive Firestore export
        uses: actions/upload-artifact@v3
        with:
          name: firestore-export-$(date -u +'%Y-%m-%d')
          path: ./firestore-export
          retention-days: 14
          
      - name: Cleanup credentials  # Security best practice
        if: always()
        run: rm -rf .credentials