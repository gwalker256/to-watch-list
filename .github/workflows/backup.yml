name: Backup

on:
  workflow_dispatch:  # Trigger manually or schedule later

jobs:
  backup:
    runs-on: ubuntu-latest

    steps:
      # Check out the repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install firebase-admin
      - name: Install dependencies
        run: npm install firebase-admin

      # Debugging step: List files to ensure the script is found
      - name: Debug - List files
        run: ls -la

      # Run the Firestore export script
      - name: Run Firestore backup
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}  # Ensure the secret is loaded here
        run: node export-firestore.js
